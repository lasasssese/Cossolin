<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verso il Ritorno - Manfredonia Calcio</title>
    <style>
        :root {
            --primary: #0077c8; /* Azzurro Manfredonia */
            --secondary: #ffffff;
            --bg-dark: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .photo-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, #00a8ff, #ffffff);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: filter 0.3s ease;
        }

        .mood-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 2.2rem;
            background: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 1.6rem;
            margin: 10px 0 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .location-tag {
            display: inline-block;
            background: rgba(0, 119, 200, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 5px;
            border-radius: 12px;
        }

        .time-box span {
            display: block;
            font-size: 1.6rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .time-box small {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .happiness-section {
            margin: 25px 0 15px;
            text-align: left;
        }

        .bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .bar-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, #38bdf8, #4ade80);
            transition: width 0.3s ease;
        }

        .status-text {
            font-style: italic;
            font-size: 1rem;
            margin: 15px 0;
            min-height: 48px;
            color: #e2e8f0;
        }

        .simulator {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="photo-wrapper" id="photoFrame">
        <!-- Assicurati di caricare la tua foto su GitHub con nome foto.jpg -->
        <img src="foto.jpg" alt="Io a Manfredonia" id="userPhoto">
        <div class="mood-badge" id="moodEmoji">😎</div>
    </div>

    <h1>Attesa Biancoceleste</h1>
    <div class="location-tag" id="locationText">📍 In giro per il Lungomare di Manfredonia</div>

    <div class="timer-grid">
        <div class="time-box"><span id="days">730</span><small>Giorni</small></div>
        <div class="time-box"><span id="hours">00</span><small>Ore</small></div>
        <div class="time-box"><span id="minutes">00</span><small>Min</small></div>
        <div class="time-box"><span id="seconds">00</span><small>Sec</small></div>
    </div>

    <div class="happiness-section">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
            <span>Livello Felicità / Hype Stadio</span>
            <span id="happinessPct">10%</span>
        </div>
        <div class="bar-bg">
            <div class="bar-fill" id="happinessBar"></div>
        </div>
    </div>

    <p class="status-text" id="statusMessage">
        "Giorno 1: Si passeggia al Castello e si prende un caffè in centro aspettando il Miramare..."
    </p>

    <div class="simulator">
        <label for="timeSlider" style="font-size: 0.85rem; display: block; margin-bottom: 8px;">
            ⏩ Trascina per simulare il passare dei 2 anni:
        </label>
        <input type="range" id="timeSlider" min="0" max="730" value="0">
    </div>
</div>

<script>
    const slider = document.getElementById('timeSlider');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minsEl = document.getElementById('minutes');
    const secsEl = document.getElementById('seconds');
    const emojiEl = document.getElementById('moodEmoji');
    const locationEl = document.getElementById('locationText');
    const statusEl = document.getElementById('statusMessage');
    const barEl = document.getElementById('happinessBar');
    const pctEl = document.getElementById('happinessPct');
    const photoFrame = document.getElementById('photoFrame');

    const totalDays = 730; // 2 anni

    const stages = [
        { max: 150, emoji: "😎", loc: "📍 Passeggiata sul Lungomare Nazario Sauro", msg: "Si gira per Manfredonia con calma olimpica. La strada è lunga ma non si molla." },
        { max: 365, emoji: "🚶‍♂️", loc: "📍 Caffè in Piazza del Popolo", msg: "Primo anno quasi andato! Ormai conosco ogni bar e ogni vicolo della città." },
        { max: 550, emoji: "🙂", loc: "📍 Vista Castello Svevo Angioino", msg: "Meno di un anno! Comincio già a sentire i cori in lontananza..." },
        { max: 700, emoji: "😁", loc: "📍 Vicino allo Stadio Miramare", msg: "Ci siamo quasi! Sciarpa già pronta nell'armadio." },
        { max: 729, emoji: "🤩", loc: "📍 Davanti ai cancelli del Miramare", msg: "ULTIMI GIORNI! L'adrenalina è alle stelle!" },
        { max: 730, emoji: "⚽🔥", loc: "🏟️ DENTRO LO STADIO - FORZA MANFREDONIA!", msg: "DASPO FINITO! SI TORNA A CASA A TIFARE IL MANFREDONIA!" }
    ];

    function updateScene(passedDays) {
        const remaining = totalDays - passedDays;
        const pct = Math.round((passedDays / totalDays) * 100);

        daysEl.textContent = remaining;
        barEl.style.width = Math.max(5, pct) + "%";
        pctEl.textContent = pct + "%";

        // Effetto luminosità e scala man mano che cresce la felicità
        const scale = 1 + (pct / 100) * 0.12;
        photoFrame.style.transform = `scale(${scale})`;

        if (pct > 80) {
            document.body.style.background = "linear-gradient(135deg, #005596 0%, #00a8ff 100%)";
        } else {
            document.body.style.background = "linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%)";
        }

        const currentStage = stages.find(s => passedDays <= s.max) || stages[stages.length - 1];
        emojiEl.textContent = currentStage.emoji;
        locationEl.textContent = currentStage.loc;
        statusEl.textContent = `"${currentStage.msg}"`;
    }

    slider.addEventListener('input', (e) => {
        updateScene(parseInt(e.target.value));
    });

    // Orologio secondi real-time per dare movimento
    let sec = 59;
    let min = 59;
    let hr = 23;
    setInterval(() => {
        sec--;
        if (sec < 0) { sec = 59; min--; }
        if (min < 0) { min = 59; hr--; }
        if (hr < 0) { hr = 23; }
        secsEl.textContent = sec < 10 ? '0' + sec : sec;
        minsEl.textContent = min < 10 ? '0' + min : min;
        hoursEl.textContent = hr < 10 ? '0' + hr : hr;
    }, 1000);

    updateScene(0);
</script>

</body>
</html>
